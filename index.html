<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="바쁜 하루를 위한 할 일·루틴 체크 앱">
  <title>오늘 챙김</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="wrap">
      <h1>오늘 챙김</h1>
      <p class="tagline">할 일과 루틴을 한 곳에서, 놓치지 않게</p>
    </div>
  </header>

  <nav class="tabs" aria-label="화면 선택">
    <div class="wrap tabs-inner">
      <button class="tab is-active" data-tab="today" aria-current="page">✅ 오늘</button>
      <button class="tab" data-tab="routines">🔁 루틴 관리</button>
      <button class="tab" data-tab="week">📊 이번 주</button>
    </div>
  </nav>

  <main class="wrap">

    <!-- ===== 오늘 ===== -->
    <section id="tab-today" class="panel" aria-label="오늘 할 일">
      <div class="date-nav">
        <button class="btn btn-ghost" id="prevDay" aria-label="전날로 이동">◀ 전날</button>
        <div class="date-label" id="dateLabel" aria-live="polite"></div>
        <button class="btn btn-ghost" id="nextDay" aria-label="다음날로 이동">다음날 ▶</button>
      </div>
      <div class="center"><button class="btn btn-small" id="goToday">오늘로 돌아가기</button></div>

      <div id="summary" class="card summary" aria-live="polite"></div>

      <div id="carry" class="card carry" hidden></div>

      <h2 class="section-title">🔁 오늘의 루틴</h2>
      <ul id="todayRoutines" class="list"></ul>

      <h2 class="section-title">📝 오늘 할 일</h2>
      <form id="taskForm" class="card form" autocomplete="off">
        <label class="field">
          <span>할 일 적기</span>
          <input type="text" id="taskText" placeholder="예) 수업자료 인쇄하기" maxlength="80" required>
        </label>
        <div class="row">
          <label class="field">
            <span>분류</span>
            <select id="taskCat"></select>
          </label>
          <label class="field">
            <span>중요도</span>
            <select id="taskPri">
              <option value="2">⭐ 꼭 해야 함</option>
              <option value="1" selected>보통</option>
              <option value="0">여유 있음</option>
            </select>
          </label>
          <label class="field">
            <span>시간 (선택)</span>
            <input type="time" id="taskTime">
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">＋ 할 일 추가</button>
      </form>

      <div class="filters" role="group" aria-label="할 일 보기 방식">
        <button class="chip is-active" data-filter="all" aria-pressed="true">전체 보기</button>
        <button class="chip" data-filter="todo" aria-pressed="false">남은 일만 보기</button>
      </div>
      <ul id="taskList" class="list"></ul>
    </section>

    <!-- ===== 루틴 관리 ===== -->
    <section id="tab-routines" class="panel" aria-label="루틴 관리" hidden>
      <h2 class="section-title">새 루틴 만들기</h2>
      <p class="hint">루틴은 정한 요일마다 ‘오늘’ 화면에 자동으로 나타나요.</p>

      <div class="card">
        <p class="label-text">빠른 추가 (눌러서 채우기)</p>
        <div id="presets" class="presets"></div>
      </div>

      <form id="routineForm" class="card form" autocomplete="off">
        <label class="field">
          <span>루틴 이름</span>
          <input type="text" id="routineName" placeholder="예) 저녁 스트레칭 10분" maxlength="60" required>
        </label>
        <div class="row">
          <label class="field">
            <span>분류</span>
            <select id="routineCat"></select>
          </label>
          <label class="field">
            <span>시간 (선택)</span>
            <input type="time" id="routineTime">
          </label>
        </div>
        <div class="field">
          <span id="daysLabel">반복 요일</span>
          <div id="dayPicker" class="day-picker" role="group" aria-labelledby="daysLabel"></div>
          <div class="quick-days">
            <button type="button" class="chip" id="daysAll">매일</button>
            <button type="button" class="chip" id="daysWeekday">평일만</button>
            <button type="button" class="chip" id="daysWeekend">주말만</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">＋ 루틴 추가</button>
      </form>

      <h2 class="section-title">내 루틴 목록</h2>
      <ul id="routineList" class="list"></ul>
    </section>

    <!-- ===== 이번 주 ===== -->
    <section id="tab-week" class="panel" aria-label="이번 주 결과" hidden>
      <h2 class="section-title">이번 주 한눈에 보기</h2>
      <p class="hint">막대를 누르면 그날 화면으로 이동해요.</p>
      <div id="weekChart" class="card"></div>
      <div id="weekInsights" class="card"></div>
    </section>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="footer wrap">
    <p>기록은 이 기기의 브라우저에만 저장돼요. 다른 기기와는 공유되지 않아요.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
