<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="바쁜 하루를 위한 할 일·루틴 체크 앱">
  <title>오늘 챙김</title>
  <style>
:root {
  --bg: #f5f6fa;
  --card: #ffffff;
  --text: #1f2430;
  --muted: #5b6272;
  --line: #d9dde7;
  --primary: #2f4fd1;
  --primary-dark: #233ba3;
  --ok: #1f7a3a;
  --ok-bg: #e4f5ea;
  --warn: #b25b00;
  --warn-bg: #fff1dc;
  --danger: #b3261e;
  --radius: 14px;
  --tap: 52px;
}

* { box-sizing: border-box; }

html { font-size: 18px; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  line-height: 1.6;
  word-break: keep-all;
}

.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

/* ---------- 헤더 / 탭 ---------- */
.app-header { background: var(--primary); color: #fff; padding: 18px 0 14px; }
.app-header h1 { margin: 0; font-size: 1.6rem; }
.tagline { margin: 2px 0 0; font-size: 0.95rem; opacity: 0.95; }

.tabs { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.tabs-inner { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding-top: 8px; padding-bottom: 8px; }
.tab {
  min-height: var(--tap);
  border: 2px solid transparent;
  background: transparent;
  border-radius: 12px;
  font: inherit;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
}
.tab.is-active { background: #e7ecff; color: var(--primary-dark); border-color: var(--primary); }

main { padding-top: 16px; padding-bottom: 24px; }

/* ---------- 공통 ---------- */
.section-title { font-size: 1.2rem; margin: 26px 0 8px; }
.hint { margin: 0 0 10px; color: var(--muted); font-size: 0.95rem; }
.center { text-align: center; margin: 4px 0 12px; }
.label-text { margin: 0 0 8px; font-weight: 700; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}

button, input, select { font: inherit; color: inherit; }

:focus-visible { outline: 3px solid #ffb000; outline-offset: 2px; }

.btn {
  min-height: var(--tap);
  padding: 0 18px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: #fff;
  font-weight: 700;
  cursor: pointer;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-ghost { background: #fff; }
.btn-block { width: 100%; }
.btn-small { min-height: 44px; font-size: 0.95rem; }
.btn-danger { color: var(--danger); border-color: #e7b9b5; background: #fff; }

.chip {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  border: 2px solid var(--line);
  background: #fff;
  font-weight: 600;
  cursor: pointer;
}
.chip.is-active { background: #e7ecff; border-color: var(--primary); color: var(--primary-dark); }

/* ---------- 폼 ---------- */
.form .field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-weight: 700; margin-bottom: 4px; }
.field input[type="text"], .field input[type="time"], .field select {
  width: 100%;
  min-height: var(--tap);
  padding: 0 12px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #fff;
}
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
#tab-routines .row { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 560px) {
  .row, #tab-routines .row { grid-template-columns: 1fr; gap: 0; }
}

.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.day-picker { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day-btn {
  min-height: var(--tap);
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #fff;
  font-weight: 700;
  cursor: pointer;
}
.day-btn[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
.quick-days { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

/* ---------- 날짜 이동 ---------- */
.date-nav { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.date-label { text-align: center; font-size: 1.25rem; font-weight: 800; }
.badge-today { display: inline-block; margin-left: 6px; padding: 0 10px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 0.8rem; vertical-align: middle; }
@media (max-width: 480px) {
  .date-nav { grid-template-columns: 1fr 1fr; }
  .date-label { grid-column: 1 / -1; order: -1; }
}

/* ---------- 요약 ---------- */
.summary .big { font-size: 1.7rem; font-weight: 800; margin: 0; }
.summary .big small { font-size: 1rem; font-weight: 600; color: var(--muted); }
.progress { height: 18px; background: #e8ebf3; border-radius: 999px; overflow: hidden; margin: 10px 0; }
.progress > div { height: 100%; background: var(--ok); border-radius: 999px; transition: width 0.3s; }
.msg { margin: 0; font-weight: 600; }
.next-up { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.all-done { background: var(--ok-bg); color: var(--ok); }

.carry { background: var(--warn-bg); border-color: #f0cf9c; }
.carry p { margin: 0 0 10px; font-weight: 700; }

/* ---------- 목록 ---------- */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
}
.item.is-done { background: #f0f2f7; }
.item.is-done .item-text { text-decoration: line-through; color: var(--muted); }
.item.high { border-left: 8px solid #e8590c; }

.check {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 3px solid #8a93a8;
  background: #fff;
  font-size: 1.5rem;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.check[aria-checked="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }

.item-body { min-width: 0; }
.item-text { font-weight: 700; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 0.85rem; color: var(--muted); }
.tag { padding: 0 8px; border-radius: 999px; background: #eef1f8; }
.tag-streak { background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.del { min-height: 44px; padding: 0 12px; border: 2px solid #e7b9b5; border-radius: 10px; background: #fff; color: var(--danger); font-weight: 700; cursor: pointer; }

.empty { text-align: center; color: var(--muted); padding: 18px; border: 2px dashed var(--line); border-radius: var(--radius); background: #fff; }

.filters { display: flex; gap: 8px; margin: 14px 0 10px; flex-wrap: wrap; }

/* ---------- 주간 ---------- */
.week-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; }
.wbar { border: 0; background: none; cursor: pointer; padding: 0; text-align: center; }
.wbar .track { height: 130px; background: #e8ebf3; border-radius: 10px; display: flex; align-items: flex-end; overflow: hidden; border: 2px solid transparent; }
.wbar .fill { width: 100%; background: var(--primary); }
.wbar.future .fill { background: #b9c2dd; }
.wbar.sel .track { border-color: #ffb000; }
.wbar .dn { font-weight: 800; margin-top: 4px; }
.wbar .cnt { font-size: 0.8rem; color: var(--muted); }
.insight-title { margin: 0 0 8px; font-weight: 800; font-size: 1.05rem; }
.insight-list { margin: 0; padding-left: 20px; }
.insight-list li { margin-bottom: 6px; }
.rtable { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.95rem; }
.rtable th, .rtable td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }

/* ---------- 토스트 / 푸터 ---------- */
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: #1f2430; color: #fff; padding: 10px 14px; border-radius: 12px;
  display: flex; gap: 12px; align-items: center; z-index: 50; max-width: 92vw;
}
.toast[hidden] { display: none; }
.toast button { min-height: 40px; padding: 0 12px; border-radius: 8px; border: 0; background: #ffb000; color: #1f2430; font-weight: 800; cursor: pointer; }

.footer { color: var(--muted); font-size: 0.85rem; padding-bottom: 40px; text-align: center; }

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

  </style>
</head>
<body>
  <header class="app-header">
    <div class="wrap">
      <h1>오늘 챙김</h1>
      <p class="tagline">할 일과 루틴을 한 곳에서, 놓치지 않게</p>
    </div>
  </header>

  <nav class="tabs" aria-label="화면 선택">
    <div class="wrap tabs-inner">
      <button class="tab is-active" data-tab="today" aria-current="page">✅ 오늘</button>
      <button class="tab" data-tab="routines">🔁 루틴 관리</button>
      <button class="tab" data-tab="week">📊 이번 주</button>
    </div>
  </nav>

  <main class="wrap">

    <!-- ===== 오늘 ===== -->
    <section id="tab-today" class="panel" aria-label="오늘 할 일">
      <div class="date-nav">
        <button class="btn btn-ghost" id="prevDay" aria-label="전날로 이동">◀ 전날</button>
        <div class="date-label" id="dateLabel" aria-live="polite"></div>
        <button class="btn btn-ghost" id="nextDay" aria-label="다음날로 이동">다음날 ▶</button>
      </div>
      <div class="center"><button class="btn btn-small" id="goToday">오늘로 돌아가기</button></div>

      <div id="summary" class="card summary" aria-live="polite"></div>

      <div id="carry" class="card carry" hidden></div>

      <h2 class="section-title">🔁 오늘의 루틴</h2>
      <ul id="todayRoutines" class="list"></ul>

      <h2 class="section-title">📝 오늘 할 일</h2>
      <form id="taskForm" class="card form" autocomplete="off">
        <label class="field">
          <span>할 일 적기</span>
          <input type="text" id="taskText" placeholder="예) 수업자료 인쇄하기" maxlength="80" required>
        </label>
        <div class="row">
          <label class="field">
            <span>분류</span>
            <select id="taskCat"></select>
          </label>
          <label class="field">
            <span>중요도</span>
            <select id="taskPri">
              <option value="2">⭐ 꼭 해야 함</option>
              <option value="1" selected>보통</option>
              <option value="0">여유 있음</option>
            </select>
          </label>
          <label class="field">
            <span>시간 (선택)</span>
            <input type="time" id="taskTime">
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">＋ 할 일 추가</button>
      </form>

      <div class="filters" role="group" aria-label="할 일 보기 방식">
        <button class="chip is-active" data-filter="all" aria-pressed="true">전체 보기</button>
        <button class="chip" data-filter="todo" aria-pressed="false">남은 일만 보기</button>
      </div>
      <ul id="taskList" class="list"></ul>
    </section>

    <!-- ===== 루틴 관리 ===== -->
    <section id="tab-routines" class="panel" aria-label="루틴 관리" hidden>
      <h2 class="section-title">새 루틴 만들기</h2>
      <p class="hint">루틴은 정한 요일마다 ‘오늘’ 화면에 자동으로 나타나요.</p>

      <div class="card">
        <p class="label-text">빠른 추가 (눌러서 채우기)</p>
        <div id="presets" class="presets"></div>
      </div>

      <form id="routineForm" class="card form" autocomplete="off">
        <label class="field">
          <span>루틴 이름</span>
          <input type="text" id="routineName" placeholder="예) 저녁 스트레칭 10분" maxlength="60" required>
        </label>
        <div class="row">
          <label class="field">
            <span>분류</span>
            <select id="routineCat"></select>
          </label>
          <label class="field">
            <span>시간 (선택)</span>
            <input type="time" id="routineTime">
          </label>
        </div>
        <div class="field">
          <span id="daysLabel">반복 요일</span>
          <div id="dayPicker" class="day-picker" role="group" aria-labelledby="daysLabel"></div>
          <div class="quick-days">
            <button type="button" class="chip" id="daysAll">매일</button>
            <button type="button" class="chip" id="daysWeekday">평일만</button>
            <button type="button" class="chip" id="daysWeekend">주말만</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">＋ 루틴 추가</button>
      </form>

      <h2 class="section-title">내 루틴 목록</h2>
      <ul id="routineList" class="list"></ul>
    </section>

    <!-- ===== 이번 주 ===== -->
    <section id="tab-week" class="panel" aria-label="이번 주 결과" hidden>
      <h2 class="section-title">이번 주 한눈에 보기</h2>
      <p class="hint">막대를 누르면 그날 화면으로 이동해요.</p>
      <div id="weekChart" class="card"></div>
      <div id="weekInsights" class="card"></div>
    </section>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="footer wrap">
    <p>기록은 이 기기의 브라우저에만 저장돼요. 다른 기기와는 공유되지 않아요.</p>
  </footer>

  <script>
(() => {
  'use strict';

  /* ===== 상수 ===== */
  const STORAGE_KEY = 'ohneul-chimgim.v1';
  const CATS = {
    work:   { label: '업무',      icon: '💼' },
    home:   { label: '집안일',    icon: '🏠' },
    kids:   { label: '아이',      icon: '🧒' },
    health: { label: '운동·건강', icon: '💪' },
    self:   { label: '나',        icon: '🌿' }
  };
  const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
  const PRESETS = [
    { name: '운동 30분',          cat: 'health' },
    { name: '스트레칭 10분',      cat: 'health' },
    { name: '설거지',             cat: 'home' },
    { name: '빨래 돌리기',        cat: 'home' },
    { name: '청소기 돌리기',      cat: 'home' },
    { name: '아이 숙제 봐주기',   cat: 'kids' },
    { name: '내일 준비물 챙기기', cat: 'kids' },
    { name: '수업 자료 점검',     cat: 'work' },
    { name: '책 읽기 15분',       cat: 'self' }
  ];

  /* ===== 상태 ===== */
  let state = load();
  let currentDate = toKey(new Date());
  let filter = 'all';
  let tab = 'today';
  let formDays = [0, 1, 2, 3, 4, 5, 6];
  let lastDeleted = null;
  let toastTimer = null;

  /* ===== 저장 ===== */
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        return { tasks: s.tasks || [], routines: s.routines || [], log: s.log || {} };
      }
    } catch (e) { /* 무시 */ }
    return { tasks: [], routines: [], log: {} };
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      toast('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.');
    }
  }

  /* ===== 날짜 도우미 ===== */
  function pad(n) { return String(n).padStart(2, '0'); }
  function toKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromKey(k) { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(k, n) { const d = fromKey(k); d.setDate(d.getDate() + n); return toKey(d); }
  function todayKey() { return toKey(new Date()); }
  function label(k) {
    const d = fromKey(k);
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAY_NAMES[d.getDay()] + ')';
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ===== DOM 도우미 (innerHTML 미사용 → 입력값 안전) ===== */
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    Object.entries(props || {}).forEach(([k, v]) => {
      if (v === false || v == null) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    });
    kids.flat().forEach(c => {
      if (c == null || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(c));
    });
    return e;
  }
  const $ = id => document.getElementById(id);
  // null/false 자식은 건너뛰고 붙인다 (replaceChildren에 null을 넘기면 'null' 글자가 찍힘)
  function setChildren(el, ...kids) {
    el.replaceChildren(...kids.flat().filter(k => k != null && k !== false));
  }

  /* ===== 데이터 계산 ===== */
  function routinesFor(key) {
    const wd = fromKey(key).getDay();
    return state.routines.filter(r => r.days.includes(wd) && r.createdAt <= key);
  }
  function isRoutineDone(r, key) { return (state.log[key] || []).includes(r.id); }
  function tasksFor(key) { return state.tasks.filter(t => t.date === key); }

  function stats(key) {
    const ts = tasksFor(key);
    const rs = routinesFor(key);
    const total = ts.length + rs.length;
    const done = ts.filter(t => t.done).length + rs.filter(r => isRoutineDone(r, key)).length;
    return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
  }

  function streak(r) {
    let n = 0;
    let k = todayKey();
    for (let i = 0; i < 400; i++) {
      if (k < r.createdAt) break;
      if (r.days.includes(fromKey(k).getDay())) {
        if (isRoutineDone(r, k)) n++;
        else if (k !== todayKey()) break;
      }
      k = addDays(k, -1);
    }
    return n;
  }

  function sortItems(a, b) {
    // 시간 있는 것 먼저(시간순), 그다음 중요도
    const ta = a.time || '99:99', tb = b.time || '99:99';
    if (ta !== tb) return ta < tb ? -1 : 1;
    return (b.pri || 0) - (a.pri || 0);
  }

  /* ===== 토스트 ===== */
  function toast(msg, undoFn) {
    const t = $('toast');
    t.replaceChildren(h('span', { text: msg }));
    if (undoFn) t.append(h('button', { type: 'button', text: '되돌리기', onclick: () => { undoFn(); hideToast(); } }));
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast() { $('toast').hidden = true; }

  /* ===== 렌더: 오늘 ===== */
  function renderToday() {
    const isToday = currentDate === todayKey();
    $('dateLabel').replaceChildren(label(currentDate), isToday ? h('span', { class: 'badge-today', text: '오늘' }) : '');
    $('goToday').hidden = isToday;

    renderSummary();
    renderCarry();
    renderTodayRoutines();
    renderTasks();
  }

  function renderSummary() {
    const s = stats(currentDate);
    const box = $('summary');
    const ts = tasksFor(currentDate);
    const rs = routinesFor(currentDate);

    let msg;
    if (s.total === 0) msg = '아직 비어 있어요. 꼭 할 일 3개만 먼저 적어 볼까요?';
    else if (s.pct === 0) msg = '작게 시작해요. 가장 쉬운 것 하나부터!';
    else if (s.pct < 50) msg = '좋은 출발이에요. 이 흐름 그대로 가요.';
    else if (s.pct < 100) msg = '절반을 넘었어요. 거의 다 왔어요!';
    else msg = '오늘 할 일을 모두 끝냈어요. 수고했어요! 🎉';

    // 지금 먼저 할 일: 안 끝난 항목 중 시간 → 중요도 순
    const pending = [
      ...ts.filter(t => !t.done).map(t => ({ text: t.text, time: t.time, pri: t.pri })),
      ...rs.filter(r => !isRoutineDone(r, currentDate)).map(r => ({ text: r.name, time: r.time, pri: 1 }))
    ].sort(sortItems);

    box.className = 'card summary' + (s.total > 0 && s.pct === 100 ? ' all-done' : '');
    setChildren(box,
      h('p', { class: 'big' }, s.done + ' / ' + s.total + ' ', h('small', { text: '완료 · 남은 일 ' + (s.total - s.done) + '개' })),
      h('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(s.pct), 'aria-label': '오늘 진행률' },
        h('div', { style: 'width:' + s.pct + '%' })),
      h('p', { class: 'msg', text: msg }),
      pending.length ? h('p', { class: 'next-up', text: '👉 지금 먼저: ' + (pending[0].time ? pending[0].time + ' ' : '') + pending[0].text }) : null
    );
  }

  function renderCarry() {
    const box = $('carry');
    const overdue = state.tasks.filter(t => t.date < currentDate && !t.done);
    if (currentDate !== todayKey() || overdue.length === 0) { box.hidden = true; return; }
    box.hidden = false;
    box.replaceChildren(
      h('p', { text: '지난 날 못 끝낸 할 일이 ' + overdue.length + '개 있어요.' }),
      h('button', {
        class: 'btn btn-primary btn-block', type: 'button',
        text: '오늘로 가져오기',
        onclick: () => {
          overdue.forEach(t => { t.date = currentDate; });
          save(); render();
          toast(overdue.length + '개를 오늘로 가져왔어요.');
        }
      })
    );
  }

  function renderTodayRoutines() {
    const ul = $('todayRoutines');
    const rs = routinesFor(currentDate).sort(sortItems);
    if (rs.length === 0) {
      ul.replaceChildren(h('li', { class: 'empty' },
        state.routines.length === 0
          ? '아직 루틴이 없어요. ‘🔁 루틴 관리’에서 운동·집안일을 추가해 보세요.'
          : '이 날은 예정된 루틴이 없어요.'));
      return;
    }
    ul.replaceChildren(...rs.map(r => {
      const done = isRoutineDone(r, currentDate);
      const st = streak(r);
      return row({
        done,
        text: r.name,
        cat: r.cat,
        time: r.time,
        extra: st >= 2 ? h('span', { class: 'tag tag-streak', text: '🔥 ' + st + '일 연속' }) : null,
        onToggle: () => toggleRoutine(r.id)
      });
    }));
  }

  function renderTasks() {
    const ul = $('taskList');
    let ts = tasksFor(currentDate).sort((a, b) => (a.done - b.done) || sortItems(a, b));
    if (filter === 'todo') ts = ts.filter(t => !t.done);
    if (ts.length === 0) {
      ul.replaceChildren(h('li', { class: 'empty', text: filter === 'todo' ? '남은 할 일이 없어요. 👏' : '아직 할 일이 없어요. 위에서 추가해 보세요.' }));
      return;
    }
    ul.replaceChildren(...ts.map(t => row({
      done: t.done,
      text: t.text,
      cat: t.cat,
      time: t.time,
      high: t.pri === 2,
      onToggle: () => toggleTask(t.id),
      onDelete: () => deleteTask(t.id)
    })));
  }

  function row(o) {
    const c = CATS[o.cat] || CATS.self;
    return h('li', { class: 'item' + (o.done ? ' is-done' : '') + (o.high && !o.done ? ' high' : '') },
      h('button', {
        class: 'check', type: 'button', role: 'checkbox',
        'aria-checked': String(!!o.done),
        'aria-label': o.text + (o.done ? ' 완료 취소' : ' 완료로 표시'),
        text: o.done ? '✓' : '',
        onclick: o.onToggle
      }),
      h('div', { class: 'item-body' },
        h('div', { class: 'item-text', text: o.text }),
        h('div', { class: 'meta' },
          h('span', { class: 'tag', text: c.icon + ' ' + c.label }),
          o.time ? h('span', { class: 'tag', text: '⏰ ' + o.time }) : null,
          o.high ? h('span', { class: 'tag tag-streak', text: '⭐ 꼭' }) : null,
          o.extra || null)),
      o.onDelete
        ? h('button', { class: 'del', type: 'button', text: '삭제', 'aria-label': o.text + ' 삭제', onclick: o.onDelete })
        : h('span')
    );
  }

  /* ===== 동작: 할 일 ===== */
  function toggleTask(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    save(); render();
  }
  function deleteTask(id) {
    const i = state.tasks.findIndex(x => x.id === id);
    if (i < 0) return;
    const removed = state.tasks.splice(i, 1)[0];
    save(); render();
    toast('할 일을 삭제했어요.', () => { state.tasks.push(removed); save(); render(); });
  }
  function toggleRoutine(id) {
    const arr = state.log[currentDate] || [];
    state.log[currentDate] = arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id];
    save(); render();
  }

  /* ===== 렌더: 루틴 관리 ===== */
  function renderPresets() {
    $('presets').replaceChildren(...PRESETS.map(p => h('button', {
      type: 'button', class: 'chip',
      text: (CATS[p.cat].icon) + ' ' + p.name,
      onclick: () => {
        $('routineName').value = p.name;
        $('routineCat').value = p.cat;
        $('routineName').focus();
      }
    })));
  }

  function renderDayPicker() {
    $('dayPicker').replaceChildren(...DAY_NAMES.map((n, i) => h('button', {
      type: 'button', class: 'day-btn',
      'aria-pressed': String(formDays.includes(i)),
      'aria-label': n + '요일',
      text: n,
      onclick: () => {
        formDays = formDays.includes(i) ? formDays.filter(d => d !== i) : [...formDays, i];
        renderDayPicker();
      }
    })));
  }

  function daysText(days) {
    if (days.length === 7) return '매일';
    const s = [...days].sort().join('');
    if (s === '12345') return '평일';
    if (s === '06') return '주말';
    return [...days].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => DAY_NAMES[d]).join('·');
  }

  function renderRoutineList() {
    const ul = $('routineList');
    if (state.routines.length === 0) {
      ul.replaceChildren(h('li', { class: 'empty', text: '아직 만든 루틴이 없어요. 위에서 빠른 추가를 눌러 보세요.' }));
      return;
    }
    ul.replaceChildren(...state.routines.map(r => {
      const c = CATS[r.cat] || CATS.self;
      const st = streak(r);
      return h('li', { class: 'item', style: 'grid-template-columns:1fr auto' },
        h('div', { class: 'item-body' },
          h('div', { class: 'item-text', text: r.name }),
          h('div', { class: 'meta' },
            h('span', { class: 'tag', text: c.icon + ' ' + c.label }),
            h('span', { class: 'tag', text: '📅 ' + daysText(r.days) }),
            r.time ? h('span', { class: 'tag', text: '⏰ ' + r.time }) : null,
            st >= 2 ? h('span', { class: 'tag tag-streak', text: '🔥 ' + st + '일 연속' }) : null)),
        h('button', {
          class: 'del', type: 'button', text: '삭제', 'aria-label': r.name + ' 루틴 삭제',
          onclick: () => {
            if (!confirm('‘' + r.name + '’ 루틴을 삭제할까요?\n지난 기록도 함께 사라져요.')) return;
            state.routines = state.routines.filter(x => x.id !== r.id);
            Object.keys(state.log).forEach(k => { state.log[k] = state.log[k].filter(x => x !== r.id); });
            save(); render();
          }
        }));
    }));
  }

  /* ===== 렌더: 이번 주 ===== */
  function weekDays(key) {
    const d = fromKey(key);
    const mondayOffset = (d.getDay() + 6) % 7;
    const monday = addDays(key, -mondayOffset);
    return Array.from({ length: 7 }, (_, i) => addDays(monday, i));
  }

  function renderWeek() {
    const days = weekDays(currentDate);
    const tk = todayKey();

    const bars = days.map(k => {
      const s = stats(k);
      const future = k > tk;
      return h('button', {
        type: 'button',
        class: 'wbar' + (future ? ' future' : '') + (k === currentDate ? ' sel' : ''),
        'aria-label': label(k) + ' ' + (s.total ? s.done + '/' + s.total + ' 완료' : '일정 없음') + ', 이 날로 이동',
        onclick: () => { currentDate = k; setTab('today'); }
      },
        h('div', { class: 'track' }, h('div', { class: 'fill', style: 'height:' + s.pct + '%' })),
        h('div', { class: 'dn', text: DAY_NAMES[fromKey(k).getDay()] }),
        h('div', { class: 'cnt', text: s.total ? s.done + '/' + s.total : '-' }));
    });
    $('weekChart').replaceChildren(h('div', { class: 'week-bars' }, bars));

    // 인사이트
    const past = days.filter(k => k <= tk);
    let tTotal = 0, tDone = 0;
    past.forEach(k => { const s = stats(k); tTotal += s.total; tDone += s.done; });
    const weekPct = tTotal ? Math.round(tDone / tTotal * 100) : 0;

    let best = null;
    past.forEach(k => {
      const s = stats(k);
      if (s.total > 0 && (!best || s.pct > best.pct)) best = { k, pct: s.pct };
    });

    const insights = [];
    insights.push(h('li', { text: tTotal ? '이번 주 지금까지 ' + tTotal + '개 중 ' + tDone + '개 완료 (' + weekPct + '%)' : '이번 주는 아직 기록된 일정이 없어요.' }));
    if (best) insights.push(h('li', { text: '가장 잘한 날: ' + label(best.k) + ' (' + best.pct + '%)' }));

    // 루틴별 이번 주 달성
    const rrows = state.routines.map(r => {
      let sched = 0, done = 0;
      past.forEach(k => {
        if (k >= r.createdAt && r.days.includes(fromKey(k).getDay())) {
          sched++;
          if (isRoutineDone(r, k)) done++;
        }
      });
      return { r, sched, done, rate: sched ? done / sched : null };
    }).filter(x => x.sched > 0);

    const worst = rrows.filter(x => x.rate < 1).sort((a, b) => a.rate - b.rate)[0];
    if (worst) insights.push(h('li', { text: '이번 주 자주 놓친 루틴: ‘' + worst.r.name + '’ (' + worst.done + '/' + worst.sched + '). 시간대를 바꿔 보는 것도 방법이에요.' }));
    else if (rrows.length) insights.push(h('li', { text: '이번 주 루틴을 하나도 놓치지 않았어요! 👏' }));

    const box = $('weekInsights');
    setChildren(box,
      h('p', { class: 'insight-title', text: '이번 주 요약' }),
      h('ul', { class: 'insight-list' }, insights),
      rrows.length
        ? h('table', { class: 'rtable' },
            h('thead', {}, h('tr', {}, h('th', { text: '루틴' }), h('th', { text: '이번 주' }), h('th', { text: '연속' }))),
            h('tbody', {}, rrows.map(x => h('tr', {},
              h('td', { text: x.r.name }),
              h('td', { text: x.done + '/' + x.sched }),
              h('td', { text: streak(x.r) + '일' })))))
        : null
    );
  }

  /* ===== 탭 / 전체 렌더 ===== */
  function setTab(name) {
    tab = name;
    document.querySelectorAll('.tab').forEach(b => {
      const on = b.dataset.tab === name;
      b.classList.toggle('is-active', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    ['today', 'routines', 'week'].forEach(t => { $('tab-' + t).hidden = t !== name; });
    render();
    window.scrollTo({ top: 0 });
  }

  function render() {
    if (tab === 'today') renderToday();
    else if (tab === 'routines') renderRoutineList();
    else renderWeek();
  }

  /* ===== 이벤트 연결 ===== */
  function init() {
    // 분류 선택지
    const opts = Object.entries(CATS).map(([v, c]) => h('option', { value: v, text: c.icon + ' ' + c.label }));
    $('taskCat').replaceChildren(...opts.map(o => o.cloneNode(true)));
    $('routineCat').replaceChildren(...opts);

    document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

    $('prevDay').addEventListener('click', () => { currentDate = addDays(currentDate, -1); render(); });
    $('nextDay').addEventListener('click', () => { currentDate = addDays(currentDate, 1); render(); });
    $('goToday').addEventListener('click', () => { currentDate = todayKey(); render(); });

    document.querySelectorAll('.filters .chip').forEach(b => b.addEventListener('click', () => {
      filter = b.dataset.filter;
      document.querySelectorAll('.filters .chip').forEach(x => {
        const on = x === b;
        x.classList.toggle('is-active', on);
        x.setAttribute('aria-pressed', String(on));
      });
      renderTasks();
    }));

    $('taskForm').addEventListener('submit', e => {
      e.preventDefault();
      const text = $('taskText').value.trim();
      if (!text) return;
      state.tasks.push({
        id: uid(), date: currentDate, text,
        cat: $('taskCat').value, pri: Number($('taskPri').value),
        time: $('taskTime').value || '', done: false
      });
      save();
      $('taskText').value = '';
      $('taskTime').value = '';
      $('taskPri').value = '1';
      $('taskText').focus();
      render();
    });

    $('routineForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = $('routineName').value.trim();
      if (!name) return;
      if (formDays.length === 0) { toast('반복할 요일을 하나 이상 골라 주세요.'); return; }
      state.routines.push({
        id: uid(), name,
        cat: $('routineCat').value,
        time: $('routineTime').value || '',
        days: [...formDays],
        createdAt: todayKey()
      });
      save();
      $('routineName').value = '';
      $('routineTime').value = '';
      toast('루틴을 추가했어요. ‘오늘’ 화면에서 확인해 보세요.');
      render();
    });

    $('daysAll').addEventListener('click', () => { formDays = [0, 1, 2, 3, 4, 5, 6]; renderDayPicker(); });
    $('daysWeekday').addEventListener('click', () => { formDays = [1, 2, 3, 4, 5]; renderDayPicker(); });
    $('daysWeekend').addEventListener('click', () => { formDays = [0, 6]; renderDayPicker(); });

    renderPresets();
    renderDayPicker();
    render();
  }

  init();
})();

  </script>
</body>
</html>
